# df1 (deepfinance1, 3x3090) phase 1/2: rn18-tin, seeds 45+46, split by
# regime across the 3 GPUs (est 3090-h for 2 seeds: kd ~25, hl ~19, sl ~18;
# kd on cuda:1, lightest slice on cuda:0 — GPU0 has run ~3.5x slower under
# load in the past).
#
# Launch (safe on the live checkout: cell writes seed-union into existing
# JSONs, and shared set/score builds are lock-serialized across jobs):
#   python bench.py launch plans/deepfinance1-phase1.yaml && \
#   python bench.py launch plans/deepfinance1-phase2.yaml
# Optional: the df1 prebuild block in RUNBOOK-seeds.md avoids the other two
# GPUs idling while the first job builds tin-rn18 ipc100 scoring + sets.
jobs:
  - name: tinrn18-s4546-kd
    table: rn18-tin
    seeds: [45, 46]
    regimes: [kd]
    devices: [cuda:1]
  - name: tinrn18-s4546-hl
    table: rn18-tin
    seeds: [45, 46]
    regimes: [hl]
    devices: [cuda:2]
  - name: tinrn18-s4546-sl
    table: rn18-tin
    seeds: [45, 46]
    regimes: [sl]
    devices: [cuda:0]
