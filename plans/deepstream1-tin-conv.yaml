# cached-skipped. ~37 GPU-h.
#
# Disjoint from deepstream2-tin-rn18.yaml by table+method -> no shared cell.
jobs:
  - name: convtin-all
    table: conv-tin
    seeds: [42, 43, 44, 45, 46]
    regimes: [hl, sl, kd]
    ipcs: [10, 50, 100]
    methods: [random, el2nbest, cadprune, sharp, rcad, rded, ca2d, sharp2d, rcad2d]
    devices: [cuda:0, cuda:1]
